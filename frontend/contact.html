<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - CommerceHub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header"><!-- same --></header>

    <section class="breadcrumb">
        <div class="container"><ul><li><a href="index.html">Home</a></li><li>Contact</li></ul></div>
    </section>

    <section class="contact-page">
        <div class="container">
            <h1>Get In Touch</h1>
            <div class="contact-wrapper">
                <div class="contact-info">
                    <div class="info-item">
                        <i class="bi bi-geo-alt-fill"></i>
                        <h4>Address</h4>
                        <p>123 Commerce Street, Mumbai, India</p>
                    </div>
                    <div class="info-item">
                        <i class="bi bi-telephone-fill"></i>
                        <h4>Phone</h4>
                        <p>+91 98765 43210</p>
                    </div>
                    <div class="info-item">
                        <i class="bi bi-envelope-fill"></i>
                        <h4>Email</h4>
                        <p>support@commercehub.com</p>
                    </div>
                </div>
                <div class="contact-form">
                    <h3>Send us a message</h3>
                    <form onsubmit="handleContactSubmit(event)">
                        <div class="form-group">
                            <input type="text" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <input type="email" placeholder="Email Address" required>
                        </div>
                        <div class="form-group">
                            <textarea rows="5" placeholder="Your Message" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer"><!-- same --></footer>
    <script src="js/api.js"></script>
<script src="js/main.js"></script>
    <script>
        function handleContactSubmit(e) {
            e.preventDefault();
            showNotification('Message sent! We will respond shortly.', 'success');
            e.target.reset();
        }
    </script>
</body>
</html>
