<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

CommerceHub Admin

</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;

}

body{

background:#0f172a;

color:white;

}

.dashboard{

display:flex;

min-height:100vh;

}

/* =======================
SIDEBAR
======================= */

.sidebar{

width:270px;

background:#111827;

padding:30px 20px;

display:flex;

flex-direction:column;

justify-content:space-between;

}

.logo{

font-size:34px;

font-weight:800;

margin-bottom:50px;

}

.logo span{

color:#ff5b2e;

}

.menu{

display:flex;

flex-direction:column;

gap:10px;

}

.menu a{

display:flex;

align-items:center;

gap:15px;

padding:15px 18px;

border-radius:12px;

text-decoration:none;

color:#cbd5e1;

transition:.3s;

}

.menu a:hover{

background:#1f2937;

}

.menu .active{

background:#ff5b2e;

color:white;

}

.logout{

background:#ef4444;

padding:15px;

text-align:center;

border-radius:12px;

cursor:pointer;

}

.logout:hover{

background:#dc2626;

}

/* =======================
MAIN
======================= */

.main{

flex:1;

padding:35px;

}

/* =======================
TOPBAR
======================= */

.topbar{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:35px;

}

.title h1{

font-size:34px;

}

.title p{

margin-top:8px;

color:#94a3b8;

}

.actions{

display:flex;

align-items:center;

gap:20px;

}

.search{

position:relative;

}

.search input{

width:320px;

padding:15px 20px 15px 45px;

border:none;

outline:none;

border-radius:12px;

background:#1e293b;

color:white;

}

.search i{

position:absolute;

left:15px;

top:16px;

color:#94a3b8;

}

.admin{

display:flex;

align-items:center;

gap:15px;

}

.avatar{

width:45px;

height:45px;

border-radius:50%;

background:#ff5b2e;

display:flex;

justify-content:center;

align-items:center;

font-weight:700;

}

/* =======================
CARD
======================= */

.card{

background:#111827;

border-radius:20px;

padding:25px;

box-shadow:0 20px 40px rgba(0,0,0,.3);

}

.card-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

}

.card-header h2{

font-size:25px;

}

.addBtn{

background:#ff5b2e;

border:none;

padding:14px 24px;

border-radius:12px;

font-size:15px;

font-weight:600;

color:white;

cursor:pointer;

transition:.3s;

}

.addBtn:hover{

transform:translateY(-3px);

}

/* =======================
TABLE
======================= */

table{

width:100%;

border-collapse:collapse;

}

thead{

background:#1e293b;

}

th{

padding:18px;

text-align:left;

color:#cbd5e1;

}

td{

padding:18px;

border-bottom:1px solid rgba(255,255,255,.05);

}

tbody tr:hover{

background:#1b2436;

}

.product-img{

width:70px;

height:70px;

object-fit:cover;

border-radius:10px;

}

.price{

color:#22c55e;

font-weight:700;

}

.action{

display:flex;

gap:10px;

}

.edit{

background:#2563eb;

color:white;

border:none;

padding:10px 14px;

border-radius:8px;

cursor:pointer;

}

.delete{

background:#ef4444;

color:white;

border:none;

padding:10px 14px;

border-radius:8px;

cursor:pointer;

}

.status{

padding:6px 14px;

background:#16a34a;

border-radius:20px;

font-size:13px;

display:inline-block;

}
.status{

padding:6px 14px;

background:#16a34a;

border-radius:20px;

font-size:13px;

display:inline-block;

}
/* =======================
MODAL
======================= */

.modal{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.65);

display:none;

justify-content:center;

align-items:center;

z-index:999;

backdrop-filter:blur(4px);

}

.modal-content{

width:600px;

background:#111827;

border-radius:20px;

padding:30px;

box-shadow:0 20px 50px rgba(0,0,0,.4);

}

.modal-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

}

.modal-header h2{

font-size:24px;

}

.close{

font-size:30px;

cursor:pointer;

}

.form-group{

margin-bottom:20px;

}

.form-group label{

display:block;

margin-bottom:8px;

font-weight:600;

}

.form-group input,

.form-group textarea{

width:100%;

padding:14px;

background:#1e293b;

border:none;

outline:none;

border-radius:10px;

color:white;

font-size:15px;

}

.form-group textarea{

height:120px;

resize:none;

}

.saveBtn{

width:100%;

padding:15px;

background:#ff5b2e;

border:none;

border-radius:10px;

color:white;

font-size:16px;

font-weight:600;

cursor:pointer;

}

.saveBtn:hover{

background:#ff4315;

}

@media(max-width:900px){

.sidebar{

width:90px;

}

.logo{

font-size:0;

}

.logo span{

display:none;

}

.menu a{

justify-content:center;

}

.menu a span{

display:none;

}

.main{

padding:20px;

}

.search input{

width:220px;

}

}

@media(max-width:768px){

.topbar{

flex-direction:column;

align-items:flex-start;

gap:20px;

}

.actions{

width:100%;

flex-direction:column;

align-items:stretch;

}

.search input{

width:100%;

}

table{

font-size:14px;

}

}

</style>

</head>

<body>

<div class="dashboard">

<div class="sidebar">

<div>

<div class="logo">

Commerce<span>Hub</span>

</div>

<div class="menu">

<a href="admin-dashboard.html">

<i class="bi bi-grid"></i>

<span>Dashboard</span>

</a>

<a class="active">

<i class="bi bi-box-seam"></i>

<span>Products</span>

</a>

<a href="admin-orders.html">

<i class="bi bi-cart3"></i>

<span>Orders</span>

</a>

<a href="admin-users.html">

<i class="bi bi-people"></i>

<span>Users</span>

</a>

</div>

</div>

<div class="logout">

Logout

</div>

</div>

<div class="main">

<div class="topbar">

<div class="title">

<h1>Products</h1>

<p>Manage your store products</p>

</div>

<div class="actions">

<div class="search">

<i class="bi bi-search"></i>

<input
type="text"
id="searchInput"
placeholder="Search products...">

</div>

<div class="admin">

<div class="avatar">

N

</div>

<div>

<b>Niranjan</b>

<br>

<small style="color:#94a3b8">

Administrator

</small>

</div>

</div>

</div>

</div>

<div class="card">

<div class="card-header">

<h2>

Product List

</h2>

<button

class="addBtn"

id="addProductBtn">

<i class="bi bi-plus-circle"></i>

Add Product

</button>

</div>

<div style="overflow:auto;">

<table>

<thead>

<tr>

<th>Image</th>

<th>Name</th>

<th>Price</th>

<th>Status</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="productTable">

</tbody>

</table>

</div>

</div>

</div>

</div>

<!-- Product Modal -->

<div class="modal" id="productModal">

<div class="modal-content">

<div class="modal-header">

<h2>

Add Product

</h2>

<span class="close">

&times;

</span>

</div>

<form id="productForm">

<div class="form-group">

<label>

Product Name

</label>

<input
type="text"
id="productName"
required>

</div>

<div class="form-group">

<label>

Description

</label>

<textarea
id="productDescription"
required></textarea>

</div>

<div class="form-group">

<label>

Price

</label>

<input
type="number"
id="productPrice"
required>

</div>

<div class="form-group">

<label>

Image

</label>

<input
type="text"
id="productImage"
placeholder="watch.jpg"
required>

</div>

<button
class="saveBtn"
type="submit">

Save Product

</button>

</form>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/admin-products.js"></script>

</body>

</html>
