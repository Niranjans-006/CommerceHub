<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CommerceHub Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

overflow:hidden;

background:#000;

position:relative;

}

/* Background */

body::before{

content:"";

position:absolute;

width:900px;

height:900px;

background:linear-gradient(180deg,#ff5b2e,#ff2200);

transform:rotate(35deg);

left:-280px;

top:-180px;

filter:blur(15px);

opacity:.9;

}

body::after{

content:"";

position:absolute;

width:900px;

height:900px;

background:linear-gradient(180deg,#ff4d2d,#ff2200);

transform:rotate(35deg);

right:-380px;

bottom:-280px;

filter:blur(20px);

opacity:.6;

}

.container{

width:1200px;

height:720px;

display:flex;

align-items:center;

justify-content:space-between;

position:relative;

z-index:10;

}

/* Left */

.left{

width:55%;

display:flex;

justify-content:center;

align-items:center;

}

.left img{

width:95%;

max-width:550px;

animation:float 4s ease-in-out infinite;

}

@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-12px);

}

}

/* Right */

.right{

width:420px;

background:rgba(0,0,0,.55);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,.15);

border-radius:22px;

padding:45px;

box-shadow:0 20px 60px rgba(0,0,0,.6);

color:#fff;

}

.right h1{

font-size:38px;

margin-bottom:8px;

font-weight:700;

}

.right p{

font-size:14px;

color:#c9c9c9;

margin-bottom:35px;

line-height:1.7;

}

.form-group{

margin-bottom:22px;

}

.form-group label{

display:block;

margin-bottom:8px;

font-size:14px;

color:#ddd;

}

.form-group input{

width:100%;

padding:14px 16px;

border:none;

outline:none;

border-radius:10px;

background:#fff;

font-size:15px;

transition:.3s;

}

.form-group input:focus{

box-shadow:0 0 15px rgba(255,90,40,.4);

}

.row{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:25px;

font-size:13px;

color:#ccc;

}

.row a{

color:#ff6a3d;

text-decoration:none;

}

.row input{

margin-right:6px;

}

.login-btn{

width:100%;

padding:15px;

border:none;

border-radius:10px;

background:#ff5a2e;

color:#fff;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

.login-btn:hover{

background:#ff3d14;

transform:translateY(-2px);

box-shadow:0 10px 25px rgba(255,90,40,.35);

}

.divider{

margin:28px 0;

text-align:center;

color:#999;

font-size:13px;

position:relative;

}

.divider::before{

content:"";

position:absolute;

left:0;

top:50%;

width:40%;

height:1px;

background:#444;

}

.divider::after{

content:"";

position:absolute;

right:0;

top:50%;

width:40%;

height:1px;

background:#444;

}

.divider::after{

content:"";

position:absolute;

right:0;

top:50%;

width:40%;

height:1px;

background:#444;

}
.social-login{

display:flex;

gap:15px;

margin-bottom:30px;

}

.social-login button{

flex:1;

height:50px;

border:none;

border-radius:12px;

background:#1a1a1a;

color:#fff;

font-size:20px;

cursor:pointer;

transition:.3s;

}

.social-login button:hover{

background:#ff5a2e;

transform:translateY(-3px);

}

.signup{

text-align:center;

font-size:14px;

color:#bbb;

}

.signup a{

color:#ff6a3d;

text-decoration:none;

font-weight:600;

}

@media(max-width:1000px){

.container{

width:100%;

padding:30px;

}

.left{

display:none;

}

.right{

width:100%;

max-width:480px;

margin:auto;

}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<img src="image/admin-login.png" alt="Admin">

</div>

<div class="right">

<h1>Welcome Back 👋</h1>

<p>

Sign in to access CommerceHub Admin Dashboard

</p>

<form id="adminLoginForm">

<div class="form-group">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

</div>

<div class="row">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">

Forgot Password?

</a>

</div>

<button
class="login-btn"
type="submit">

Login

</button>

</form>

<div class="divider">

OR CONTINUE WITH

</div>

<div class="social-login">

<button>

<i class="bi bi-google"></i>

</button>

<button>

<i class="bi bi-apple"></i>

</button>

<button>

<i class="bi bi-github"></i>

</button>

</div>

<div class="signup">

Back to

<a href="index.html">

CommerceHub

</a>

</div>

</div>

</div>

<script src="js/admin-login.js"></script>

</body>

</html>
