<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CommerceHub Admin Users</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#0f172a;
color:#fff;
}

.dashboard{
display:flex;
min-height:100vh;
}

/* Sidebar */

.sidebar{
width:260px;
background:#111827;
padding:30px 20px;
display:flex;
flex-direction:column;
justify-content:space-between;
}

.logo{
font-size:32px;
font-weight:800;
margin-bottom:45px;
}

.logo span{
color:#ff5b2e;
}

.menu{
display:flex;
flex-direction:column;
gap:12px;
}

.menu a{
display:flex;
align-items:center;
gap:15px;
padding:15px;
border-radius:12px;
text-decoration:none;
color:#cbd5e1;
transition:.3s;
}

.menu a:hover{
background:#1f2937;
}

.menu .active{
background:#ff5b2e;
color:#fff;
}

.logout{
background:#ef4444;
padding:15px;
text-align:center;
border-radius:12px;
cursor:pointer;
}

/* Main */

.main{
flex:1;
padding:35px;
}

/* Topbar */

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:35px;
}

.title h1{
font-size:34px;
}

.title p{
margin-top:8px;
color:#94a3b8;
}

.actions{
display:flex;
align-items:center;
gap:20px;
}

.search{
position:relative;
}

.search input{
width:320px;
padding:15px 20px 15px 45px;
border:none;
outline:none;
border-radius:12px;
background:#1e293b;
color:white;
}

.search i{
position:absolute;
left:15px;
top:16px;
color:#94a3b8;
}

.admin{
display:flex;
align-items:center;
gap:15px;
}

.avatar{
width:45px;
height:45px;
border-radius:50%;
background:#ff5b2e;
display:flex;
justify-content:center;
align-items:center;
font-weight:700;
}

/* Card */

.card{
background:#111827;
border-radius:20px;
padding:25px;
box-shadow:0 20px 40px rgba(0,0,0,.3);
}

.card-header{
margin-bottom:25px;
}

.card-header h2{
font-size:25px;
}

/* Table */

table{
width:100%;
border-collapse:collapse;
}

thead{
background:#1e293b;
}

th{
padding:18px;
text-align:left;
color:#cbd5e1;
}

td{
padding:18px;
border-bottom:1px solid rgba(255,255,255,.05);
}

tbody tr:hover{
background:#1b2436;
}

.user-avatar{
width:50px;
height:50px;
border-radius:50%;
background:#ff5b2e;
display:flex;
align-items:center;
justify-content:center;
font-weight:700;
}

.role-admin{
padding:6px 14px;
background:#ef4444;
border-radius:20px;
font-size:13px;
}

.role-user{
padding:6px 14px;
background:#22c55e;
border-radius:20px;
font-size:13px;
}

.deleteBtn{
background:#ef4444;
border:none;
padding:10px 14px;
border-radius:8px;
color:white;
cursor:pointer;
}

</style>

</head>

<body>

<div class="dashboard">

<div class="sidebar">

<div>

<div class="logo">

Commerce<span>Hub</span>

</div>

<div class="menu">

<a href="admin-dashboard.html">

<i class="bi bi-grid"></i>

Dashboard

</a>

<a href="admin-products.html">

<i class="bi bi-box-seam"></i>

Products

</a>

<a href="admin-users.html" class="active">

<i class="bi bi-people"></i>

Users

</a>

<a href="admin-orders.html">

<i class="bi bi-cart3"></i>

Orders

</a>

</div>

</div>

<div class="logout">

Logout

</div>

</div>

<div class="main">

<div class="topbar">

<div class="title">

<h1>Users</h1>

<p>Manage registered users</p>

</div>

<div class="actions">

<div class="search">

<i class="bi bi-search"></i>

<input
type="text"
id="searchInput"
placeholder="Search users...">

</div>

<div class="admin">

<div class="avatar">

N

</div>

<div>

<b>Niranjan</b>

<br>

<small style="color:#94a3b8">

Administrator

</small>

</div>

</div>

</div>

</div>

<div class="card">

<div class="card-header">

<h2>

Registered Users

</h2>

</div>
<div style="overflow-x:auto;">

<table>

<thead>

<tr>

<th>Avatar</th>

<th>Name</th>

<th>Email</th>

<th>Phone</th>

<th>Role</th>

<th>Joined</th>

<th>Action</th>

</tr>

</thead>

<tbody id="userTable">

<!-- Users Load Here -->

</tbody>

</table>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="js/admin-users.js"></script>

<style>

@media(max-width:900px){

.sidebar{

width:90px;

}

.logo{

font-size:0;

}

.logo span{

display:none;

}

.menu a{

justify-content:center;

}

.main{

padding:20px;

}

.search input{

width:220px;

}

}

@media(max-width:768px){

.topbar{

flex-direction:column;

align-items:flex-start;

gap:20px;

}

.actions{

width:100%;

flex-direction:column;

align-items:stretch;

}

.search{

width:100%;

}

.search input{

width:100%;

}

table{

font-size:14px;

}

th,td{

padding:12px;

}

}

</style>

</body>

</html>
